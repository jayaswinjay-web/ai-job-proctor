    <meta name="theme-color" content="#16202c" />
    <meta name="referrer" content="same-origin" />
    <!--
      `frame-ancestors` is deliberately absent: browsers ignore it in a meta tag, and
      including it only produces a console warning on every page load. Clickjacking is
      blocked by the `X-Frame-Options: DENY` header the API sets on every response.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss: http://localhost:4000 ws://localhost:4000; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
